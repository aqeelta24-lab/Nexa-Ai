<!-- localStorage-backed shim matching the window.storage API used inside the Claude artifact sandbox -->
<script>
(function () {
  const PREFIX = "nexa_standalone:";
  window.storage = {
    async get(key) {
      const v = localStorage.getItem(PREFIX + key);
      if (v === null) return null;
      return { key, value: v };
    },
    async set(key, value) {
      localStorage.setItem(PREFIX + key, value);
      return { key, value };
    },
    async delete(key) {
      localStorage.removeItem(PREFIX + key);
      return { key, deleted: true };
    },
    async list(prefix) {
      const p = PREFIX + (prefix || "");
      const keys = Object.keys(localStorage).filter((k) => k.startsWith(p)).map((k) => k.slice(PREFIX.length));
      return { keys };
    },
  };
})();
</script>

function useTheme() {
  const [theme, setTheme] = useState("dark"); // 'dark' | 'light' | 'system'
  const [loaded, setLoaded] = useState(false);
  useEffect(() => {
    (async () => {
      try {
        const r = await window.storage.get("nexa:theme");
        if (r && r.value) setTheme(r.value);
      } catch (e) {}
      setLoaded(true);
    })();
  }, []);
  useEffect(() => {
    if (!loaded) return;
    window.storage.set("nexa:theme", theme).catch(() => {});
  }, [theme, loaded]);
  const [systemDark, setSystemDark] = useState(true);
  useEffect(() => {
    const mq = window.matchMedia("(prefers-color-scheme: dark)");
    setSystemDark(mq.matches);
    const fn = (e) => setSystemDark(e.matches);
    mq.addEventListener("change", fn);
    return () => mq.removeEventListener("change", fn);
  }, []);
  const dark = theme === "system" ? systemDark : theme === "dark";
  return { theme, setTheme, dark };
}

function useStars(count = 24) {

function fileToText(file) {
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve(r.result);
    r.onerror = () => reject(new Error("Could not read file"));
    r.readAsText(file);
  });
}

function chunkText(text, size = 700) {
  const chunks = [];
  for (let i = 0; i < text.length; i += size) chunks.push(text.slice(i, i + size));
  return chunks;
}

function scoreChunk(chunk, queryWords) {
  const lower = chunk.toLowerCase();
  let score = 0;
  for (const w of queryWords) if (w.length > 2 && lower.includes(w)) score++;
  return score;
}

function topChunksForQuery(files, query, k = 4) {
  const words = query.toLowerCase().split(/\W+/).filter(Boolean);
  const scored = [];
  for (const f of files) {
    for (const c of f.chunks) {
      const s = scoreChunk(c, words);
      if (s > 0) scored.push({ file: f.name, text: c, score: s });
    }
  }
  scored.sort((a, b) => b.score - a.score);
  return scored.slice(0, k);
}

// --- lightweight markdown-ish renderer: code fences + inline code + bold/italic ---
function renderContent(text, onCopyCode) {
  const parts = text.split(/```/g);
  const nodes = [];
  parts.forEach((part, i) => {
    if (i % 2 === 1) {
      const nl = part.indexOf("\n");
      const lang = nl === -1 ? "" : part.slice(0, nl).trim();
      const code = nl === -1 ? part : part.slice(nl + 1);
      nodes.push(
        <CodeBlock key={i} lang={lang} code={code.replace(/\n$/, "")} onCopy={onCopyCode} />
      );
    } else if (part) {
      const lines = part.split("\n");
      nodes.push(
        <p key={i} style={{ margin: "0 0 8px 0", whiteSpace: "pre-wrap", lineHeight: 1.55 }}>
          {lines.map((line, li) => {
            const segs = line.split(/(\*\*[^*]+\*\*|`[^`]+`)/g).filter(Boolean);
            return (
              <React.Fragment key={li}>
                {segs.map((seg, si) => {
                  if (seg.startsWith("**") && seg.endsWith("**")) {
                    return <strong key={si}>{seg.slice(2, -2)}</strong>;
                  }
                  if (seg.startsWith("`") && seg.endsWith("`")) {
                    return (
                      <code key={si} style={{
                        background: "rgba(139,92,246,0.15)", padding: "1px 5px",
                        borderRadius: 4, fontFamily: "'JetBrains Mono', monospace", fontSize: "0.9em"
                      }}>{seg.slice(1, -1)}</code>
                    );
                  }
                  return <span key={si}>{seg}</span>;
                })}
                {li < lines.length - 1 && <br />}
              </React.Fragment>
            );
          })}
        </p>
      );
    }
  });
  return nodes;
}

          {code}
        </code>
      </pre>
    </div>
  );
}

    const loadVoices = () => setVoices(window.speechSynthesis ? window.speechSynthesis.getVoices() : []);
    loadVoices();
    if (window.speechSynthesis) window.speechSynthesis.onvoiceschanged = loadVoices;
  }, []);

  function updateChat(id, updater) {
    setChats((prev) => prev.map((ch) => (ch.id === id ? updater(ch) : ch)));
  }

  function newChat() {
    const id = uid();
    setChats((prev) => [{ id, title: "New chat", pinned: false, messages: [], createdAt: now() }, ...prev]);
    setCurrentChatId(id);
    setMobileSidebarOpen(false);
    setInput("");
  }

  function deleteChat(id) {
    setChats((prev) => {
      const next = prev.filter((ch) => ch.id !== id);
      if (id === currentChatId) setCurrentChatId(next[0]?.id || null);
      return next.length ? next : [{ id: uid(), title: "New chat", pinned: false, messages: [], createdAt: now() }];
    });
  }

  function renameChat(id, title) {
    updateChat(id, (ch) => ({ ...ch, title: title || "Untitled" }));
  }

  function togglePin(id) {
    updateChat(id, (ch) => ({ ...ch, pinned: !ch.pinned }));
  }

  function clearConversation(id) {
    updateChat(id, (ch) => ({ ...ch, messages: [] }));
  }

  function exportChat(ch) {
    const md = ch.messages.map((m) => `### ${m.role === "user" ? "You" : "Nexa"}\n\n${m.content}\n`).join("\n---\n\n");
    const blob = new Blob([`# ${ch.title}\n\n${md}`], { type: "text/markdown" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = `${ch.title.replace(/\s+/g, "-").toLowerCase()}.md`;
    a.click();
    URL.revokeObjectURL(url);
  }

  async function shareChat(ch) {
    const md = ch.messages.map((m) => `${m.role === "user" ? "You" : "Nexa"}: ${m.content}`).join("\n\n");
    try {
      if (navigator.share) await navigator.share({ title: ch.title, text: md });
      else { await navigator.clipboard.writeText(md); setErrorBanner("__ok__Conversation copied to clipboard."); }
    } catch (e) {}
  }

  function copyToClipboard(text) {
    navigator.clipboard.writeText(text).catch(() => {});
  }

  function humanizeError(err, status) {
    if (status === 401 || status === 403) return "That API key was rejected. Double-check it in Settings → AI Provider.";
    if (status === 429) return "Rate limit reached. Wait a moment and try again.";
    if (status === 400) return "That request wasn't accepted by the model — it may be too long, malformed, or the API key is invalid.";
    if (status >= 500) return "The AI service is having trouble on its end. Please try again.";
    if (err && err.name === "AbortError") return "__stopped__";
    if (err && /network|fetch/i.test(err.message || "")) return "Network error — check your connection and try again.";
    return "Something went wrong while generating the response. Please try again.";
  }

  // ---- core generation ----
  const generate = useCallback(async (chatId, messagesForApi, assistantMsgId) => {
    setIsGenerating(true);
    setErrorBanner("");
    const controller = new AbortController();
    abortRef.current = controller;

    let system = "You are Nexa, a helpful, precise AI assistant embedded in the Nexa AI platform. Format code in fenced code blocks with a language tag.";
    if (settings.style === "concise") system += " Keep answers brief and to the point.";
    if (settings.style === "detailed") system += " Give thorough, well-structured answers.";
    if (memoryEnabled && memory.length) {
      system += "\n\nRemembered context the user has approved you to use:\n" + memory.map((m) => `- ${m.text}`).join("\n");
    }
    const lastUser = [...messagesForApi].reverse().find((m) => m.role === "user");
    if (files.length && lastUser) {
      const top = topChunksForQuery(files, lastUser.content, 4);
      if (top.length) {
        system += "\n\nRelevant excerpts from files the user uploaded (cite the file name when you use one):\n" +
          top.map((t) => `[${t.file}]: ${t.text}`).join("\n---\n");
      }
    }

    if (!(settings.useGemini && settings.geminiKey) && !settings.claudeKey) {
      setIsGenerating(false);
      abortRef.current = null;
      updateChat(chatId, (ch) => ({
        ...ch,
        messages: ch.messages.map((m) => (m.id === assistantMsgId ? {
          ...m, pending: false,
          content: "No AI provider is set up yet. This standalone build can't use Anthropic's server-side key the way the in-Claude version does — add your own Claude or Gemini API key in Settings → AI Provider to start chatting. (Image generation and voice work already, with no key needed.)",
        } : m)),
      }));
      return;
    }

    try {
      const useGemini = settings.useGemini && settings.geminiKey;
      let acc = "";

      if (useGemini) {
        const model = "gemini-2.0-flash";
        const url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:streamGenerateContent?alt=sse&key=${encodeURIComponent(settings.geminiKey)}`;
        const resp = await fetch(url, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          signal: controller.signal,
          body: JSON.stringify({
            systemInstruction: { parts: [{ text: system }] },
            generationConfig: { temperature: settings.temperature, maxOutputTokens: 1500 },
            contents: messagesForApi.map((m) => ({
              role: m.role === "assistant" ? "model" : "user",
              parts: [{ text: m.content }],
            })),
          }),
        });
        if (!resp.ok || !resp.body) throw Object.assign(new Error("Request failed"), { status: resp.status });

        const reader = resp.body.getReader();
        const decoder = new TextDecoder();
        let buf = "";
        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          buf += decoder.decode(value, { stream: true });
          const lines = buf.split("\n");
          buf = lines.pop();
          for (const line of lines) {
            if (!line.startsWith("data:")) continue;
            const payload = line.slice(5).trim();
            if (!payload) continue;
            try {
              const evt = JSON.parse(payload);
              const piece = evt?.candidates?.[0]?.content?.parts?.map((p) => p.text || "").join("") || "";
              if (piece) {
                acc += piece;
                updateChat(chatId, (ch) => ({
                  ...ch,
                  messages: ch.messages.map((m) => (m.id === assistantMsgId ? { ...m, content: acc } : m)),
                }));
              }
            } catch (e) { /* ignore partial json */ }
          }
        }
      } else {
        const resp = await fetch("https://api.anthropic.com/v1/messages", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "x-api-key": settings.claudeKey,
            "anthropic-version": "2023-06-01",
            "anthropic-dangerous-direct-browser-access": "true",
          },
          signal: controller.signal,
          body: JSON.stringify({
            model: "claude-sonnet-4-6",
            max_tokens: 1500,
            temperature: settings.temperature,
            system,
            stream: true,
            messages: messagesForApi.map((m) => ({ role: m.role, content: m.content })),
          }),
        });

        if (!resp.ok || !resp.body) {
        const hasSavedKey = setR.status === "fulfilled" && setR.value && (() => {throw Object.assign(new Error("Request failed"), { status: resp.status });
        }

        const reader = resp.body.getReader();
        const decoder = new TextDecoder();
        let buf = "";

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          buf += decoder.decode(value, { stream: true });
          const lines = buf.split("\n");
          buf = lines.pop();
          for (const line of lines) {
            if (!line.startsWith("data:")) continue;
            const payload = line.slice(5).trim();
            if (!payload || payload === "[DONE]") continue;
            try {
              const evt = JSON.parse(payload);
              if (evt.type === "content_block_delta" && evt.delta && evt.delta.text) {
                acc += evt.delta.text;
                updateChat(chatId, (ch) => ({
                  ...ch,
                  messages: ch.messages.map((m) => (m.id === assistantMsgId ? { ...m, content: acc } : m)),
                }));
              }
            } catch (e) { /* ignore partial json */ }
          }
        }
      }

      updateChat(chatId, (ch) => ({
        ...ch,
        messages: ch.messages.map((m) => (m.id === assistantMsgId ? { ...m, content: acc || "(No response was generated.)", pending: false } : m)),
      }));
    } catch (err) {
      const msg = humanizeError(err, err.status);
      if (msg === "__stopped__") {
        updateChat(chatId, (ch) => ({
          ...ch,
          messages: ch.messages.map((m) => (m.id === assistantMsgId ? { ...m, pending: false, stopped: true } : m)),
        }));
      } else {
        updateChat(chatId, (ch) => ({
          ...ch,
          messages: ch.messages.map((m) => (m.id === assistantMsgId ? { ...m, pending: false, error: msg } : m)),
        }));
      }
    } finally {
      setIsGenerating(false);
      abortRef.current = null;
    }
  }, [settings, memory, memoryEnabled, files]);

  function detectsImageIntent(text) {
    const NOUNS = "image|picture|pic|photo|photograph|artwork|illustration|drawing|painting|wallpaper|portrait|poster|logo|tasveer";
    const ACTIONS = "generate|create|make|draw|design|sketch|paint|render";
    const pattern = new RegExp(
      `\\b(${ACTIONS})\\b[^.?!]{0,30}\\b(${NOUNS})\\b` +
      `|\\b(${NOUNS})\\s+of\\b` +
      `|\\b(${NOUNS})\\s+(banao?|banane?)\\b|\\bimage\\s+wala\\b`,
      "i"
    );
    return pattern.test(text);
  }

  function extractImagePrompt(text) {
    let p = text;
    const strip = [
      /\b(can|could|will)\s+you\s+/gi, /\bplease\b/gi, /\bkindly\b/gi,
      /\b(generate|create|make|draw|design|sketch|paint|render)\s+(me\s+)?(an?|the)?\s*(image|picture|pic|photo|photograph|artwork|illustration|drawing|painting|wallpaper|portrait|poster|logo)\s*(of)?\b/gi,
      /\b(image|picture|pic|photo|photograph|portrait|wallpaper|poster|tasveer)\s+(banao?|banane?)(\s+wala)?\s*(karo)?\b/gi,
      /\bis\s*ko\b/gi, /\bkaro\b/gi,
    ];
    for (const re of strip) p = p.replace(re, " ");
    p = p.replace(/\s+/g, " ").trim();
    return p || text;
  }

  function sendMessage(overrideText) {
    const text = (overrideText !== undefined ? overrideText : input).trim();
    if (!text || isGenerating || !currentChat) return;
    setInput("");
    setEditingId(null);
    const userMsg = { id: uid(), role: "user", content: text, ts: now() };
    const isFirst = currentChat.messages.length === 0;

    if (detectsImageIntent(text)) {
      if (!settings.capImageGen) {
        const notice = { id: uid(), role: "assistant", ts: now(),
          content: "Image generation is turned off in Settings → Capabilities. Turn it back on to generate images." };
        updateChat(currentChat.id, (ch) => ({ ...ch, title: isFirst ? text.slice(0, 40) : ch.title, messages: [...ch.messages, userMsg, notice] }));
        return;
      }
      const prompt = extractImagePrompt(text);
      const imgMsg = { id: uid(), role: "assistant", type: "image", prompt, seed: Math.floor(Math.random() * 1e9), ts: now() };
      updateChat(currentChat.id, (ch) => ({
        ...ch,
        title: isFirst ? text.slice(0, 40) : ch.title,
        messages: [...ch.messages, userMsg, imgMsg],
      }));
      return;
    }

    const assistantMsg = { id: uid(), role: "assistant", content: "", ts: now(), pending: true };
    updateChat(currentChat.id, (ch) => ({
      ...ch,
      title: isFirst ? text.slice(0, 40) : ch.title,
      messages: [...ch.messages, userMsg, assistantMsg],
    }));

    const apiHistory = [...currentChat.messages, userMsg];
    generate(currentChat.id, apiHistory, assistantMsg.id);
  }

  function regenerateImage(chatId, msgId) {
    updateChat(chatId, (ch) => ({
      ...ch,
      messages: ch.messages.map((m) => (m.id === msgId ? { ...m, seed: Math.floor(Math.random() * 1e9), failed: false } : m)),
    }));
  }

  function stopGeneration() {
    if (abortRef.current) abortRef.current.abort();
  }

  function regenerate(chatId) {
    const ch = chats.find((c2) => c2.id === chatId);
    if (!ch || isGenerating) return;
    const msgs = ch.messages;
    const lastAssistantIdx = [...msgs].reverse().findIndex((m) => m.role === "assistant");
    if (lastAssistantIdx === -1) return;
    const idx = msgs.length - 1 - lastAssistantIdx;
    const assistantMsgId = uid();
    const history = msgs.slice(0, idx);
    updateChat(chatId, (c2) => ({
      ...c2,
      messages: [...history, { id: assistantMsgId, role: "assistant", content: "", ts: now(), pending: true }],
    }));
    generate(chatId, history, assistantMsgId);
  }

  function retryMessage(chatId, msgId) {
    const ch = chats.find((c2) => c2.id === chatId);
    const idx = ch.messages.findIndex((m) => m.id === msgId);
    const history = ch.messages.slice(0, idx);
    updateChat(chatId, (c2) => ({
      ...c2,
      messages: [...history, { id: msgId, role: "assistant", content: "", ts: now(), pending: true }],
    }));
    generate(chatId, history, msgId);
  }

  function startEdit(msg) {
    setEditingId(msg.id);
    setInput(msg.content);
    textareaRef.current?.focus();
  }

  function submitEdit() {
    if (!currentChat) return;
    const idx = currentChat.messages.findIndex((m) => m.id === editingId);
    if (idx === -1) return sendMessage();
    const text = input.trim();
    if (!text) return;
    const history = currentChat.messages.slice(0, idx);
    const userMsg = { id: uid(), role: "user", content: text, ts: now() };
    const assistantMsg = { id: uid(), role: "assistant", content: "", ts: now(), pending: true };
    updateChat(currentChat.id, (ch) => ({ ...ch, messages: [...history, userMsg, assistantMsg] }));
    setEditingId(null);
    setInput("");
    generate(currentChat.id, [...history, userMsg], assistantMsg.id);
  }

  function deleteMessage(chatId, msgId) {
    updateChat(chatId, (ch) => ({ ...ch, messages: ch.messages.filter((m) => m.id !== msgId) }));
  }

  function saveToMemory(text) {
    setMemory((prev) => [...prev, { id: uid(), text: text.slice(0, 300), ts: now() }]);
  }

  async function resetAllData() {
    try {
      await Promise.allSettled([
        window.storage.delete("nexa:chats"), window.storage.delete("nexa:memory"),
        window.storage.delete("nexa:settings"), window.storage.delete("nexa:theme"),
        window.storage.delete("nexa:dockpos"),
      ]);
    } catch (e) {}
    const id = uid();
    setChats([{ id, title: "New chat", pinned: false, messages: [], createdAt: now() }]);
    setCurrentChatId(id);
    setMemory([]);
    setFiles([]);
    setDockPos(null);
    setSettings({ temperature: 0.7, style: "balanced", autoplay: false, rate: 1, voiceURI: "", openaiKey: "",
      fontStyle: "default", profileName: "", capImageGen: true, capVoiceIn: true, capVoiceOut: true, notifyOnReply: false,
      geminiKey: "", useGemini: false, sttLang: "en-US", claudeKey: "", layoutStyle: "minimal" });
    setShowSettings(false);setErrorBanner("__ok__All local data has been cleared.");
  }

  // ---- voice: speech-to-text ----
  async function toggleListening() {
    if (!settings.capVoiceIn) { setErrorBanner("Voice input is turned off in Settings → Capabilities."); return; }
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) { setErrorBanner("Speech recognition isn't supported in this browser. Use Chrome or Edge."); return; }
    if (listening) { recognitionRef.current?.stop(); setListening(false); return; }
    if (!window.isSecureContext) {
      setErrorBanner("Voice input needs a secure page (opened over https, or from localhost). Opening the file directly can block mic access in some browsers.");
      return;
    }
    // Ask for mic permission explicitly first — SpeechRecognition's own prompt is unreliable
    // when a file is opened directly (as opposed to a hosted page), so we trigger it ourselves.
    try {
      if (navigator.mediaDevices?.getUserMedia) {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        stream.getTracks().forEach((t) => t.stop());
      }
    } catch (err) {
      setErrorBanner("Microphone access was blocked. Check the padlock/site-settings icon in the address bar and allow the microphone for this page.");
      return;
    }
    const rec = new SR();
    rec.continuous = true;
    rec.interimResults = true;
    rec.lang = settings.sttLang || "en-US";
    rec.onresult = (e) => {
      let transcript = "";
      for (let i = 0; i < e.results.length; i++) transcript += e.results[i][0].transcript;
      setInput(transcript);
    };
    rec.onerror = (e) => {
      setListening(false);
      if (e.error === "not-allowed" || e.error === "service-not-allowed") setErrorBanner("Microphone permission was denied. Allow it for this page in your browser settings and try again.");
      else if (e.error === "no-speech") setErrorBanner("Didn't catch that — no speech detected. Try again.");
      else setErrorBanner("Voice input stopped due to an error (" + e.error + "). Try again.");
    };
    rec.onend = () => setListening(false);
    recognitionRef.current = rec;
    try {
      rec.start();
      setListening(true);
    } catch (err) {
      setErrorBanner("Couldn't start voice input. Try tapping the mic again.");
      setListening(false);
    }
  }

  // ---- voice: text-to-speech ----
  function speak(msg) {
    if (!settings.capVoiceOut) { setErrorBanner("Voice output is turned off in Settings → Capabilities."); return; }
    if (!window.speechSynthesis) { setErrorBanner("Speech playback isn't supported in this browser. Use Chrome or Edge."); return; }
    if (speakingId === msg.id) {
      window.speechSynthesis.cancel();
      if (window._nexaSpeakKeepAlive) { clearInterval(window._nexaSpeakKeepAlive); window._nexaSpeakKeepAlive = null; }
      setSpeakingId(null);
      return;
    }
    window.speechSynthesis.cancel();
    if (window._nexaSpeakKeepAlive) { clearInterval(window._nexaSpeakKeepAlive); window._nexaSpeakKeepAlive = null; }
    const u = new SpeechSynthesisUtterance(msg.content);
    u.rate = settings.rate;
    const v = voices.find((v2) => v2.voiceURI === settings.voiceURI);
    if (v) u.voice = v;
    u.onend = () => {
      if (window._nexaSpeakKeepAlive) { clearInterval(window._nexaSpeakKeepAlive); window._nexaSpeakKeepAlive = null; }
      setSpeakingId(null);
    };
    u.onerror = () => {
      if (window._nexaSpeakKeepAlive) { clearInterval(window._nexaSpeakKeepAlive); window._nexaSpeakKeepAlive = null; }
      setSpeakingId(null);
    };
    try {
      window.speechSynthesis.speak(u);
    } catch (err) {
      setErrorBanner("Couldn't play voice. Try again.");
      return;
    }
    // Chrome silently pauses long speech after ~15s unless nudged — this keeps it alive.
    window._nexaSpeakKeepAlive = setInterval(() => {
      if (!window.speechSynthesis.speaking) { clearInterval(window._nexaSpeakKeepAlive); window._nexaSpeakKeepAlive = null; return; }
      window.speechSynthesis.pause();
      window.speechSynthesis.resume();
    }, 5000);
    setSpeakingId(msg.id);
  }

  useEffect(() => {
    if (!settings.autoplay) return;
    const last = currentChat?.messages?.[currentChat.messages.length - 1];
    if (last && last.role === "assistant" && last.type !== "image" && !last.pending && last.content && !last.error) speak(last);
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [currentChat?.messages?.filter((m) => !m.pending).length]);

  useEffect(() => {
    if (!settings.notifyOnReply || !document.hidden) return;
    const last = currentChat?.messages?.[currentChat.messages.length - 1];
    if (last && last.role === "assistant" && !last.pending && (last.content || last.type === "image") &&
        typeof Notification !== "undefined" && Notification.permission === "granted") {
      new Notification("Nexa AI", { body: last.type === "image" ? "Your image is ready." : last.content.slice(0, 100) });
    }
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [currentChat?.messages?.filter((m) => !m.pending).length]);

  async function enableNotifications() {
    if (typeof Notification === "undefined") { setErrorBanner("Notifications aren't supported in this browser."); return false; }
    if (Notification.permission === "granted") return true;
    const perm = await Notification.requestPermission();
    if (perm !== "granted") { setErrorBanner("Notification permission was denied in your browser settings."); return false; }
    return true;
  }

  async function handleFileUpload(e) {
    const list = Array.from(e.target.files || []);
    for (const file of list) {
      const isText = /\.(txt|md|csv|json)$/i.test(file.name) || file.type.startsWith("text/");
      if (!isText) {
        setErrorBanner(`"${file.name}" isn't a supported format here — only .txt, .md, .csv and .json can be read in-browser. PDF/DOCX need a server-side extractor that isn't available in this sandbox.`);
        continue;
      }
      if (file.size > 2_000_000) {
        setErrorBanner(`"${file.name}" is too large (max 2MB in this demo).`);
        continue;
      }
      try {
        const text = await fileToText(file);
        setFiles((prev) => [...prev, { id: uid(), name: file.name, chunks: chunkText(text) }]);
      } catch (err) {
        setErrorBanner(`Couldn't read "${file.name}".`);
      }
    }
    e.target.value = "";
  }

  function handleKeyDown(e) {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      if (editingId) submitEdit(); else sendMessage();
    }
  }

  const fontStacks = {
    default: "'Inter', -apple-system, sans-serif",
    serif: "'Fraunces', Georgia, serif",
    mono: "'JetBrains Mono', monospace",
  };

  if (!booted) {
    return (
      <div style={{ height: "100vh", display: "flex", alignItems: "center", justifyContent: "center", background: COLORS.bgDark, color: COLORS.violet, fontFamily: "sans-serif" }}>
        Loading Nexa AI…
      </div>
    );
  }

  const filteredChats = [...chats]
    .filter((ch) => ch.title.toLowerCase().includes(searchQuery.toLowerCase()))
    .sort((a, b) => (b.pinned - a.pinned) || (b.createdAt - a.createdAt));

  return (
    <div style={{
      height: "100vh", width: "100%", display: "flex", background: c.bg, color: c.text,
      fontFamily: fontStacks[settings.fontStyle] || fontStacks.default, overflow: "hidden", position: "relative"
    }}>
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:wght@600;700&family=JetBrains+Mono:wght@400;500&display=swap');
        * { box-sizing: border-box; }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-thumb { background: rgba(139,92,246,0.4); border-radius: 8px; }
        button { font-family: inherit; }
        textarea { font-family: inherit; }
        @keyframes pulse-dot { 0%,100% { opacity: 0.25; } 50% { opacity: 1; } }
        @keyframes twinkle { 0%,100% { opacity: 0.15; transform: scale(0.8); } 50% { opacity: 1; transform: scale(1.3); } }
        @keyframes glowPulse { 0%,100% { box-shadow: 0 0 0 1px rgba(139,92,246,0.1), 0 6px 24px -8px rgba(139,92,246,0.4); } 50% { box-shadow: 0 0 0 1px rgba(139,92,246,0.22), 0 8px 34px -6px rgba(139,92,246,0.65); } }
        .glow-composer { animation: glowPulse 3.2s ease-in-out infinite; transition: border-color 0.2s; }
        .glow-composer:focus-within { border-color: rgba(139,92,246,0.8) !important; }
        .pulse span { animation: pulse-dot 1.1s infinite; }
        .pulse span:nth-child(2) { animation-delay: 0.15s; }

    </div>function ActionDock({ open, setOpen, colors, dark, onCall, onGenerate, onLibrary, onUpload, listening, pos, setPos, horizontal }) {

function ImageLibrary({ colors, dark, chats, onOpenChat, onClose }) {
  const [viewing, setViewing] = useState(null);

  );

  items.sort((a, b) => b.ts - a.ts);

  async function download(url, prompt) {
    try {
      const resp = await fetch(url);
      const blob = await resp.blob();
      const objUrl = URL.createObjectURL(blob);

      a.href = objUrl; a.download = `${prompt.slice(0, 30).replace(/\s+/g, "-")}.jpg`;

            <div style={{ textAlign: "center", color: colors.textDim, fontSize: 13.5, marginTop: 60 }}>

                  </button>

function ImageMessage({ msg, colors, onRegenerate, onCopyPrompt, openaiKey }) {
  const [status, setStatus] = useState("loading"); // loading | loaded | error
  const [src, setSrc] = useState(null);
  const [errMsg, setErrMsg] = useState("");
  const pollinationsUrl = `https://image.pollinations.ai/prompt/${encodeURIComponent(msg.prompt)}?width=768&height=768&seed=${msg.seed}&nologo=true`;

  useEffect(() => {
    let cancelled = false;
    setStatus("loading"); setErrMsg("");
    if (openaiKey) {
      fetch("https://api.openai.com/v1/images/generations", {
        method: "POST",
        headers: { "Content-Type": "application/json", Authorization: `Bearer ${openaiKey}` },
        body: JSON.stringify({ model: "dall-e-3", prompt: msg.prompt, n: 1, size: "1024x1024" }),
      })
        .then(async (r) => {
          if (!r.ok) {
            const body = await r.json().catch(() => ({}));
            throw new Error(body?.error?.message || `Request failed (${r.status})`);
          }
          return r.json();
        })
        .then((data) => {
          if (cancelled) return;
          const url = data?.data?.[0]?.url;
          if (!url) throw new Error("No image returned");
          setSrc(url);
        })
        .catch((e) => { if (!cancelled) { setErrMsg(e.message || "OpenAI request failed"); setStatus("error"); } });
    } else {
      setSrc(pollinationsUrl);
    }
    return () => { cancelled = true; };
  }, [msg.prompt, msg.seed, openaiKey]);

  async function download() {
    try {
      const resp = await fetch(src);
      const blob = await resp.blob();
      const objUrl = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = objUrl; a.download = `${msg.prompt.slice(0, 30).replace(/\s+/g, "-")}.jpg`;
      a.click();
      URL.revokeObjectURL(objUrl);
    } catch (e) {}
  }

  return (
    <div style={{ maxWidth: 320 }}>
      <div style={{ fontSize: 12, color: colors.textDim, marginBottom: 6 }}>
        {openaiKey ? "Generated via your OpenAI key (DALL·E 3)" : "Generated via Pollinations.ai (free third-party service)"} — prompt: "{msg.prompt}"
      </div>
      <div style={{
        borderRadius: 14, overflow: "hidden", background: colors.bg3, minHeight: 200,
        display: "flex", alignItems: "center", justifyContent: "center", border: `1px solid ${colors.border}`
      }}>
        {status === "error" ? (
          <div style={{ padding: 20, textAlign: "center", color: COLORS.danger, fontSize: 13 }}>
            <AlertCircle size={18} style={{ marginBottom: 6 }} />
            <div>{errMsg || "Couldn't reach the image service."}</div>
          </div>
        ) : (
          <>
            {status === "loading" && (
              <span className="pulse" style={{ display: "inline-flex", gap: 4, padding: 30 }}>
                <span style={{ width: 6, height: 6, borderRadius: 6, background: colors.textDim, display: "inline-block" }} />
                <span style={{ width: 6, height: 6, borderRadius: 6, background: colors.textDim, display: "inline-block" }} />
                <span style={{ width: 6, height: 6, borderRadius: 6, background: colors.textDim, display: "inline-block" }} />
              </span>
            )}
            {src && (
              <img
                src={src} alt={msg.prompt}
                style={{ width: "100%", display: status === "loaded" ? "block" : "none" }}
                onLoad={() => setStatus("loaded")}
                onError={() => { setErrMsg("Couldn't load the generated image."); setStatus("error"); }}
              />
            )}
          </>
        )}
      </div>
      <div style={{ display: "flex", gap: 4, marginTop: 6 }}>
        <TinyBtn onClick={onRegenerate} title="Regenerate" colors={colors}><RotateCcw size={13} /></TinyBtn>
        <TinyBtn onClick={download} title="Download" colors={colors}><Download size={13} /></TinyBtn>
        <TinyBtn onClick={() => onCopyPrompt(msg.prompt)} title="Copy prompt" colors={colors}><Copy size={13} /></TinyBtn>
      </div>
    </div>
  );
}

function MessageBubble({ msg, colors, dark, onCopy, onEdit, onDelete, onRegenerate, onRetry, onSave, onSpeak, speakingId, onRegenerateImage, openaiKey, capVoiceOut }) {

  }
  return (
    <div style={{ display: "flex", justifyContent: isUser ? "flex-end" : "flex-start", marginBottom: 18 }}>
      <div style={{ maxWidth: "88%", display: "flex", flexDirection: "column", alignItems: isUser ? "flex-end" : "flex-start" }}>
        <div style={{
          background: isUser ? `linear-gradient(135deg, ${COLORS.violet}, ${COLORS.violet2})` : colors.bg3,
          color: isUser ? "#fff" : colors.text,
          borderRadius: isUser ? "16px 16px 4px 16px" : "16px 16px 16px 4px",

            <span className="pulse" style={{ display: "inline-flex", gap: 4 }}>
              <span style={{ width: 5, height: 5, borderRadius: 5, background: colors.textDim, display: "inline-block" }} />
              <span style={{ width: 5, height: 5, borderRadius: 5, background: colors.textDim, display: "inline-block" }} />
              <span style={{ width: 5, height: 5, borderRadius: 5, background: colors.textDim, display: "inline-block" }} />
            </span>
          ) : (
            renderContent(msg.content, onCopy)
          )}
          {msg.stopped && <div style={{ fontSize: 12, opacity: 0.7, marginTop: 4 }}>Generation stopped.</div>}
          {msg.error && (
            <div style={{ display: "flex", flexDirection: "column", gap: 6, color: COLORS.danger }}>
              <span style={{ display: "flex", alignItems: "center", gap: 5 }}><AlertCircle size={13} /> {msg.error}</span>

              }}><RotateCcw size={12} /> Retry</button>
            </div>
          )}
        </div>
        {!msg.pending && (
          <div style={{ display: "flex", gap: 4, marginTop: 4 }}>
            <TinyBtn onClick={() => onCopy(msg.content)} title="Copy" colors={colors}><Copy size={13} /></TinyBtn>
            {isUser && <TinyBtn onClick={onEdit} title="Edit" colors={colors}><Pencil size={13} /></TinyBtn>}
            {!isUser && msg.content && !msg.error && <TinyBtn onClick={onRegenerate} title="Regenerate" colors={colors}><RotateCcw size={13} /></TinyBtn>}
            {!isUser && msg.content && !msg.error && capVoiceOut && <TinyBtn onClick={onSpeak} title="Read aloud" colors={colors}>{speakingId === msg.id ? <VolumeX size={13} /> : <Volume2 size={13} />}</TinyBtn>}
            {!isUser && msg.content && !msg.error && <TinyBtn onClick={onSave} title="Save to memory" colors={colors}><Brain size={13} /></TinyBtn>}
            <TinyBtn onClick={onDelete} title="Delete" colors={colors} danger><Trash2 size={13} /></TinyBtn>
          </div>
        )}
      </div>
    </div>
  );
}

                  background: `linear-gradient(135deg, rgba(139,92,246,0.07), rgba(79,142,247,0.05))`,
                  border: `1px solid ${COLORS.violetSoft}`,
                  borderRadius: 14, padding: "13px 14px", cursor: "pointer", textAlign: "left", color: colors.text
                }}>
                  <span style={{
                    width: 32, height: 32, borderRadius: 10, display: "flex", alignItems: "center", justifyContent: "center",
                    background: `linear-gradient(135deg, ${COLORS.violet}, ${COLORS.violet2})`, color: "#fff",
                    boxShadow: `0 0 10px ${COLORS.violetSoft}`
                  }}>{item.icon}</span>
                  <span style={{ flex: 1 }}>
                    <div style={{ fontSize: 14.5 }}>{item.label}</div>
                    {item.sub && <div style={{ fontSize: 12, color: colors.textDim, marginTop: 1 }}>{item.sub}</div>}
                  </span>
                  <ChevronRight size={16} color={colors.textDim} />
                </button>
              ))}
              <div style={{ fontSize: 11.5, color: colors.textDim, textAlign: "center", marginTop: 14, lineHeight: 1.5 }}>
                Nexa AI runs in this browser. There's no account system here, so nothing above touches billing or a server.
              </div>
            </div>
          )}

          {page === "profile" && (
            <Section label="Display name">
              <input value={settings.profileName} onChange={(e) => setSettings((s) => ({ ...s, profileName: e.target.value }))}
                placeholder="What should Nexa call you?"
                style={{ width: "100%", background: colors.bg3, border: `1px solid ${colors.border}`, borderRadius: 8, padding: 10, color: colors.text, fontSize: 14 }} />
              <div style={{ fontSize: 11.5, color: colors.textDim, marginTop: 8 }}>Stored only in this browser. Used nowhere else — there's no account behind this.</div>
            </Section>
          )}

          {page === "layout" && (
            <Section label="Home screen style">
              <SegmentedControl options={[["minimal", "Minimal (new)"], ["classic", "Classic"]]}
                value={settings.layoutStyle} onChange={(v) => setSettings((s) => ({ ...s, layoutStyle: v }))} colors={colors} />
              <div style={{ fontSize: 11.5, color: colors.textDim, marginTop: 10, lineHeight: 1.6 }}>
                <strong style={{ color: colors.text }}>Minimal</strong> — the cleaner layout: no Get Plus/Log in row, just the
                compact quick-actions dock that you can hold and drag anywhere.<br /><br />
                <strong style={{ color: colors.text }}>Classic</strong> — brings back the original header (Get Plus, Log in) and
                the floating side dock.
              </div>
            </Section>
          )}

          {page === "provider" && (
            <>
              <div style={{ fontSize: 12, color: COLORS.violet2, background: "rgba(139,92,246,0.1)", border: `1px solid ${COLORS.violetSoft}`, borderRadius: 10, padding: 10, marginBottom: 14, lineHeight: 1.6 }}>
                This is the standalone build — it has no server, so there's no free built-in chat here. Add one key below to enable chat.
              </div>
              <Section label="Your Anthropic (Claude) API key">
                <input type="password" value={settings.claudeKey} onChange={(e) => setSettings((s) => ({ ...s, claudeKey: e.target.value, useGemini: false }))}
                  placeholder="sk-ant-…" style={{ width: "100%", background: colors.bg3, border: `1px solid ${colors.border}`, borderRadius: 8, color: colors.text, padding: 10, fontSize: 13 }} />
                <div style={{ fontSize: 11.5, color: colors.textDim, marginTop: 8, lineHeight: 1.6 }}>
                  Get one at console.anthropic.com. Used automatically once entered, unless Gemini is toggled on below.
                </div>
              </Section>
              <Section label="Chat model">
                <ToggleRow label="Use Gemini instead of Claude" checked={settings.useGemini}
                  onChange={(v) => setSettings((s) => ({ ...s, useGemini: v }))} colors={colors} />
              </Section>
              <Section label="Your Gemini API key">
                <input type="password" value={settings.geminiKey} onChange={(e) => setSettings((s) => ({ ...s, geminiKey: e.target.value }))}
                  placeholder="AIza…" style={{ width: "100%", background: colors.bg3, border: `1px solid ${colors.border}`, borderRadius: 8, color: colors.text, padding: 10, fontSize: 13 }} />
                <div style={{ fontSize: 11.5, color: colors.textDim, marginTop: 8, lineHeight: 1.6 }}>
                  Get a free key at aistudio.google.com/apikey. Used only when the toggle above is on.
                </div>
              </Section>
              <div style={{ fontSize: 11, color: colors.textDim, marginTop: 4 }}>
                Both keys are stored only in this browser (localStorage) and sent only to that provider, directly from your device — never to any Nexa server, because there isn't one.
              </div>
            </>
          )}

          {page === "appearance" && (
            <Section label="Color mode">
              <SegmentedControl options={[["dark", "Dark"], ["light", "Light"], ["system", "System"]]} value={theme} onChange={setTheme} colors={colors} />
            </Section>
          )}

          {page === "font" && (
            <Section label="Font style">
              <SegmentedControl options={[["default", "Default"], ["serif", "Serif"], ["mono", "Mono"]]} value={settings.fontStyle} onChange={(v) => setSettings((s) => ({ ...s, fontStyle: v }))} colors={colors} />
            </Section>
          )}

          {page === "voice" && (
            <>
              <Section label="Response style">
                <SegmentedControl options={[["concise", "Concise"], ["balanced", "Balanced"], ["detailed", "Detailed"]]} value={settings.style} onChange={(v) => setSettings((s) => ({ ...s, style: v }))} colors={colors} />
              </Section>
              <Section label={`Temperature (${settings.temperature.toFixed(1)})`}>
                <input type="range" min="0" max="1" step="0.1" value={settings.temperature}
                  onChange={(e) => setSettings((s) => ({ ...s, temperature: parseFloat(e.target.value) }))} style={{ width: "100%" }} />
              </Section>
              <Section label="Playback">
                <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
                  <ToggleRow label="Auto-play spoken replies" checked={settings.autoplay} onChange={(v) => setSettings((s) => ({ ...s, autoplay: v }))} colors={colors} />
                  <div>
                    <label style={{ fontSize: 12, color: colors.textDim }}>Voice ({voices.length} available on this device)</label>
                    <select value={settings.voiceURI} onChange={(e) => setSettings((s) => ({ ...s, voiceURI: e.target.value }))}<option value="">Browser default</option>
                      {voices.map((v) => <option key={v.voiceURI} value={v.voiceURI}>{v.name} ({v.lang})</option>)}
                    </select>
                    {voices.length < 10 && (
                      <div style={{ fontSize: 11, color: colors.textDim, marginTop: 5 }}>
                        Only {voices.length} voice{voices.length === 1 ? "" : "s"} found — this list comes from your device/browser,
                        not from Nexa. Installing more language voices in your phone's system settings will add more here automatically.
                      </div>
                    )}
                  </div>
                  <div>
                    <label style={{ fontSize: 12, color: colors.textDim }}>Speech speed ({settings.rate.toFixed(1)}×)</label>
                    <input type="range" min="0.5" max="1.8" step="0.1" value={settings.rate}
                      onChange={(e) => setSettings((s) => ({ ...s, rate: parseFloat(e.target.value) }))} style={{ width: "100%" }} />
                  </div>
                </div>
              </Section>
              <Section label="Microphone input language">
                <select value={settings.sttLang} onChange={(e) => setSettings((s) => ({ ...s, sttLang: e.target.value }))}
                  style={{ width: "100%", background: colors.bg3, border: `1px solid ${colors.border}`, borderRadius: 8, color: colors.text, padding: 8, fontSize: 13 }}>
                  {STT_LANGUAGES.map(([code, label]) => <option key={code} value={code}>{label}</option>)}
                </select>
                <div style={{ fontSize: 11.5, color: colors.textDim, marginTop: 6 }}>
                  {STT_LANGUAGES.length} languages — sets what the microphone listens for when you tap Call/mic.
                </div>
              </Section>
              <Section label="Image generation">
                <label style={{ fontSize: 12, color: colors.textDim, display: "block", marginBottom: 4 }}>Your OpenAI API key (optional)</label>
                <input type="password" value={settings.openaiKey} onChange={(e) => setSettings((s) => ({ ...s, openaiKey: e.target.value }))}
                  placeholder="sk-…" style={{ width: "100%", background: colors.bg3, border: `1px solid ${colors.border}`, borderRadius: 8, color: colors.text, padding: 8, fontSize: 13 }} />
                <div style={{ fontSize: 11.5, color: colors.textDim, marginTop: 6, lineHeight: 1.5 }}>
                  Stored only in this browser and sent only to OpenAI when you generate an image. Leave blank to use the free built-in generator.
                </div>
              </Section>
            </>
          )}

          {page === "capabilities" && (
            <Section label="Turn features on or off">
              <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
                <ToggleRow label="Memory" checked={memoryEnabled} onChange={setMemoryEnabled} colors={colors} />
                <ToggleRow label="Image generation" checked={settings.capImageGen} onChange={(v) => setSettings((s) => ({ ...s, capImageGen: v }))} colors={colors} />
                <ToggleRow label="Voice input (microphone)" checked={settings.capVoiceIn} onChange={(v) => setSettings((s) => ({ ...s, capVoiceIn: v }))} colors={colors} />
                <ToggleRow label="Voice output (read aloud)" checked={settings.capVoiceOut} onChange={(v) => setSettings((s) => ({ ...s, capVoiceOut: v }))} colors={colors} />
              </div>
              <div style={{ fontSize: 11.5, color: colors.textDim, marginTop: 12 }}>
                Each toggle actually gates that feature — turn one off and the related buttons stop working immediately.
              </div>
            </Section>
          )}

          {page === "notifications" && (
            <Section label="Reply notifications">
              <ToggleRow label="Notify me when a reply finishes" checked={settings.notifyOnReply}
                onChange={async (v) => {
                  if (v) { const ok = await onEnableNotifications(); if (!ok) return; }
                  setSettings((s) => ({ ...s, notifyOnReply: v }));
                }} colors={colors} />
              <div style={{ fontSize: 11.5, color: colors.textDim, marginTop: 8, lineHeight: 1.5 }}>
                Uses your browser's real notification permission — only fires while this tab is in the background.
              </div>
            </Section>
          )}

          {page === "privacy" && (
            <>
              <Section label="Memory">
                <ToggleRow label="Let Nexa use saved memory in replies" checked={memoryEnabled} onChange={setMemoryEnabled} colors={colors} />
                {memory.length === 0 && <div style={{ color: colors.textDim, fontSize: 13, marginTop: 10 }}>Nothing saved yet.</div>}
                {memory.map((m) => (
                  <div key={m.id} style={{ display: "flex", justifyContent: "space-between", gap: 8, padding: "8px 0", borderBottom: `1px solid ${colors.border}` }}>
                    <span style={{ fontSize: 13.5 }}>{m.text}</span>
                    <button onClick={() => setMemory((prev) => prev.filter((x) => x.id !== m.id))} style={{ background: "none", border: "none", color: COLORS.danger, cursor: "pointer", flexShrink: 0 }}><Trash2 size={14} /></button>
                  </div>
                ))}
              </Section>
              <Section label="Local data">
                <button onClick={onResetAll} style={{
                  width: "100%", background: "none", border: `1px solid ${COLORS.danger}`, color: COLORS.danger,
                  borderRadius: 10, padding: "10px 12px", fontSize: 13.5, cursor: "pointer"
                }}>Clear all chats, memory & settings</button>
                <div style={{ fontSize: 11.5, color: colors.textDim, marginTop: 8 }}>
                  Everything here lives only in this browser — this deletes it for good, right now.
                </div>
              </Section>
            </>
          )}

          {page === "sharing" && (
            <Section label="This conversation">
              <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
                <button onClick={onExport} style={{ display: "flex", alignItems: "center", gap: 8, background: colors.bg3, border: "none", borderRadius: 10, padding: "10px 12px", color: colors.text, cursor: "pointer", fontSize: 13.5 }}>
                  <Download size={15} /> Export as Markdown
                </button>
                <button onClick={onShare} style={{ display: "flex", alignItems: "center", gap: 8, background: colors.bg3, border: "none", borderRadius: 10, padding: "10px 12px", color: colors.text, cursor: "pointer", fontSize: 13.5 }}>
                  <Share2 size={15} /> Share / copy conversation
                </button>
              </div>
            </Section>
          )}
        </div>
      </div>
    </div>
  );
}

function MemoryPanel({ colors, memory, setMemory, memoryEnabled, setMemoryEnabled, onClose }) {
  const [note, setNote] = useState("");
  return (
    <Modal onClose={onClose} colors={colors} title="Memory">
      <ToggleRow label="Memory enabled" checked={memoryEnabled} onChange={setMemoryEnabled} colors={colors} />
      <div style={{ display: "flex", gap: 6, margin: "12px 0" }}>
        <input value={note} onChange={(e) => setNote(e.target.value)} placeholder="Add something for Nexa to remember…"
          style={{ flex: 1, background: colors.bg3, border: `1px solid ${colors.border}`, borderRadius: 8, padding: 8, color: colors.text, fontSize: 13 }} />
        <button onClick={() => { if (note.trim()) { setMemory((m) => [...m, { id: uid(), text: note.trim(), ts: now() }]); setNote(""); } }}
          style={{ background: `linear-gradient(135deg, ${COLORS.violet}, ${COLORS.violet2})`, border: "none", borderRadius: 8, padding: "0 12px", color: "#fff", cursor: "pointer" }}>Add</button>
      </div>
      {memory.length === 0 && <div style={{ color: colors.textDim, fontSize: 13 }}>Nothing saved yet.</div>}
      {memory.map((m) => (
        <div key={m.id} style={{ display: "flex", justifyContent: "space-between", gap: 8, padding: "8px 0", borderBottom: `1px solid ${colors.border}` }}>
          <span style={{ fontSize: 13.5 }}>{m.text}</span>
          <button onClick={() => setMemory((prev) => prev.filter((x) => x.id !== m.id))} style={{ background: "none", border: "none", color: COLORS.danger, cursor: "pointer", flexShrink: 0 }}><Trash2 size={14} /></button>
        </div>
      ))}
      {memory.length > 0 && (
        <button onClick={() => setMemory([])} style={{ marginTop: 12, background: "none", border: `1px solid ${COLORS.danger}`, color: COLORS.danger, borderRadius: 8, padding: "6px 10px", fontSize: 12, cursor: "pointer" }}>
          Clear all memory
        </button>
      )}
    </Modal>
  );
}

function Section({ label, children }) {
  return (
    <div style={{ marginBottom: 18 }}>
      <div style={{ fontSize: 12, fontWeight: 600, textTransform: "uppercase", letterSpacing: 0.5, opacity: 0.6, marginBottom: 8 }}>{label}</div>
      {children}
    </div>
  );
}

function SegmentedControl({ options, value, onChange, colors }) {
  return (
    <div style={{ display: "flex", background: colors.bg3, borderRadius: 10, padding: 3, gap: 3 }}>
      {options.map(([v, l]) => (
        <button key={v} onClick={() => onChange(v)} style={{
          flex: 1, padding: "6px 8px", borderRadius: 8, border: "none", cursor: "pointer", fontSize: 12.5,
          background: value === v ? `linear-gradient(135deg, ${COLORS.violet}, ${COLORS.violet2})` : "transparent",
          color: value === v ? "#fff" : colors.text, fontWeight: value === v ? 600 : 400
        }}>{l}</button>
      ))}
    </div>
  );
}

function ToggleRow({ label, checked, onChange, colors }) {
  return (
    <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
      <span style={{ fontSize: 13.5 }}>{label}</span>
      <button onClick={() => onChange(!checked)} aria-pressed={checked} aria-label={label} style={{
        width: 40, height: 22, borderRadius: 20, border: "none", cursor: "pointer",
        background: checked ? `linear-gradient(135deg, ${COLORS.violet}, ${COLORS.violet2})` : colors.bg3,
        position: "relative", flexShrink: 0, boxShadow: checked ? `0 0 10px ${COLORS.violetSoft}` : "none",
        transition: "background 0.2s"
      }}>
        <span style={{
          position: "absolute", top: 2, left: checked ? 20 : 2, width: 18, height: 18, borderRadius: 18,
          background: "#fff", transition: "left 0.15s"
        }} />
      </button>
    </div>
  );
}

const rootEl = document.getElementById("root");
ReactDOM.createRoot(rootEl).render(<NexaAI />);
</script>
</body>
</html>
                      style={{ width: "100%", marginTop: 4, background: colors.bg3, border: `1px solid ${colors.border}`, borderRadius: 8, color: colors.text, padding: 8 }}>
